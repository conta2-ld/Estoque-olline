<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Estoque</title>

    <!-- Biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin-bottom: 0;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .caixa {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            margin-top: 20px;
        }

        .produto {
            background: #f8fafc;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .produto h2 {
            margin-top: 0;
            color: #2563eb;
        }

        .erro {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            word-break: break-word;
        }

        .sucesso {
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 10px;
        }

    </style>

</head>

<body>

<header>

    <h1>📦 Meu Estoque</h1>

    <p>Consulte nossos produtos</p>

</header>


<main>

    <div class="caixa">

        <h2>🔎 Pesquisar produto</h2>

        <input
            type="text"
            id="busca"
            placeholder="Digite o nome do produto"
        >

        <button onclick="pesquisar()">
            🔍 Pesquisar
        </button>

        <div id="resultado"></div>

    </div>

</main>


<script>

// ==================================================
// CONFIGURAÇÃO DO SUPABASE
// ==================================================

// COLOQUE AQUI A SUA PROJECT URL
const SUPABASE_URL =
"https://nujligvlqfwlcczaeyij.supabase.co";


// COLOQUE AQUI A SUA PUBLISHABLE KEY
const SUPABASE_KEY =
"sb_publishable_uY2H1Mg4TLy686rMcQ3LAw_0k-wAC-C";


// ==================================================
// CONECTAR AO SUPABASE
// ==================================================

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==================================================
// PESQUISAR PRODUTO
// ==================================================

async function pesquisar() {

    // Pegar o texto digitado
    const nome =
        document
        .getElementById("busca")
        .value
        .trim();


    // Área onde aparece o resultado
    const resultado =
        document
        .getElementById("resultado");


    // Verificar se o usuário digitou alguma coisa
    if (nome === "") {

        resultado.innerHTML = `
            <p>
                ⚠️ Digite o nome de um produto.
            </p>
        `;

        return;
    }


    // Mostrar mensagem enquanto pesquisa
    resultado.innerHTML = `
        <p>
            🔎 Pesquisando...
        </p>
    `;


    try {

        // Consultar a tabela produtos
        const { data, error } =

            await supabaseClient

            .from("produtos")

            .select("*")

            .ilike(
                "nome",
                `%${nome}%`
            );


        // Se o Supabase retornar um erro
        if (error) {

            console.error(
                "Erro do Supabase:",
                error
            );

            resultado.innerHTML = `

                <div class="erro">

                    ❌ Erro ao consultar o estoque.

                    <br><br>

                    <strong>Detalhes:</strong>

                    <br>

                    ${error.message}

                </div>

            `;

            return;
        }


        // Se nenhum produto foi encontrado
        if (!data || data.length === 0) {

            resultado.innerHTML = `

                <p>
                    ❌ Produto não encontrado.
                </p>

            `;

            return;
        }


        // Limpar resultado anterior
        resultado.innerHTML = "";


        // Mostrar todos os produtos encontrados
        data.forEach(
            produto => {

                resultado.innerHTML += `

                    <div class="produto">

                        <h2>
                            📦 ${produto.nome}
                        </h2>


                        <p>

                            🔢 Quantidade:

                            <strong>
                                ${produto.quantidade}
                            </strong>

                        </p>


                        <p>

                            💰 Preço:

                            <strong>

                                R$

                                ${Number(
                                    produto.preco
                                ).toFixed(2)}

                            </strong>

                        </p>


                        <p>

                            📝 Informações:

                            ${
                                produto.informacoes
                                ||
                                "Nenhuma informação adicional."
                            }

                        </p>

                    </div>

                `;

            }
        );


    } catch (erro) {


        console.error(
            "Erro inesperado:",
            erro
        );


        resultado.innerHTML = `

            <div class="erro">

                ❌ Não foi possível conectar ao estoque.

                <br><br>

                <strong>
                    Detalhes:
                </strong>

                <br>

                ${erro.message || erro}

            </div>

        `;

    }

}

</script>

</body>

</html>
