<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Estoque</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .caixa {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
        }

        .produto {
            background: #f8fafc;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .produto h2 {
            margin-top: 0;
            color: #2563eb;
        }

        .erro {
            color: red;
        }
    </style>
</head>

<body>

<header>
    <h1>📦 Meu Estoque</h1>
    <p>Consulte nossos produtos</p>
</header>

<main>

    <div class="caixa">

        <h2>🔎 Pesquisar produto</h2>

        <input 
            type="text" 
            id="busca" 
            placeholder="Digite o nome do produto"
        >

        <button onclick="pesquisar()">
            Pesquisar
        </button>

        <div id="resultado"></div>

    </div>

</main>

<script>

// ======================================
// CONFIGURAÇÃO DO SUPABASE
// ======================================

// COLOQUE AQUI A SUA PROJECT URL
const SUPABASE_URL = "https://nujligvlqfwlcczaeyij.supabase.co/rest/v1/";

// COLOQUE AQUI A SUA PUBLISHABLE KEY
const SUPABASE_KEY = "sb_publishable_uY2H1Mg4TLy686rMcQ3LAw_0k-wAC-C";


// ======================================
// FUNÇÃO PARA PESQUISAR PRODUTO
// ======================================

async function pesquisar() {

    const nome = document
        .getElementById("busca")
        .value
        .trim();

    const resultado = document
        .getElementById("resultado");

    if (nome === "") {

        resultado.innerHTML =
            "<p>Digite o nome de um produto.</p>";

        return;
    }

    resultado.innerHTML =
        "<p>🔎 Pesquisando...</p>";

    try {

        const resposta = await fetch(
            `${SUPABASE_URL}/rest/v1/produtos?nome=ilike.*${encodeURIComponent(nome)}*&select=*`,
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if (!resposta.ok) {
            throw new Error("Erro ao consultar o banco de dados.");
        }

        const produtos = await resposta.json();

        if (produtos.length === 0) {

            resultado.innerHTML =
                "<p>❌ Produto não encontrado.</p>";

            return;
        }

        resultado.innerHTML = "";

        produtos.forEach(produto => {

            resultado.innerHTML += `

                <div class="produto">

                    <h2>📦 ${produto.nome}</h2>

                    <p>
                        🔢 Quantidade:
                        <strong>${produto.quantidade}</strong>
                    </p>

                    <p>
                        💰 Preço:
                        <strong>R$ ${Number(produto.preco).toFixed(2)}</strong>
                    </p>

                    <p>
                        📝 Informações:
                        ${produto.informacoes || "Nenhuma informação adicional."}
                    </p>

                </div>

            `;

        });

    } catch (erro) {

        console.error(erro);

        resultado.innerHTML = `
            <p class="erro">
                ❌ Não foi possível consultar o estoque.
            </p>
        `;

    }

}

</script>

</body>
</html>
